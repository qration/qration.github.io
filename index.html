<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Qration" />
  <meta property="og:description" content="A cross-platform RSS+ feed reader." />
  <meta property="og:url" content="https://qration.github.io" />
  <meta property="og:image" content="https://raw.githubusercontent.com/qration/app/refs/heads/main/screenshot.png" />
  <meta property="og:image:alt" content="A screenshot of Qration on desktop" />
  <meta property="og:image:width" content="1919">
  <meta property="og:image:height" content="1171">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#030712"/>
  <link rel="stylesheet" href="/style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="/script.js"></script>
  <title>Qration</title>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/">
        <svg class="wordmark" width="330.8535" height="109" viewBox="0 0 330.8535 109">
          <use href="/assets/qration-wordmark.svg#wordmark"/>
        </svg>
      </a>
      <button onclick="toggleTheme()" class="icon-button">
        <i class="ti ti-sun" id="theme-icon" style="font-size:1.25rem"></i>
      </button>
    </div>
  </nav>
  <div class="content-wrapper">
    <div class="content">
      <div class="header">
        <h1>One place, for everything you care about.</h1>
        <h2>Qration is a cross-platform, free and open source RSS+ reader app.</h2>
        <div class="buttons">
          <a href="/download" style="width:min-content">
            <button class="download">
              <i class="ti ti-download"></i>
              <span>Download</span>
            </button>
          </a>
          <a href="https://github.com/qration/app" style="width:min-content" target="_blank">
            <button class="download secondary">
              <i class="ti ti-brand-github"></i>
              <span>GitHub</span>
            </button>
          </a>
          <a href="https://discord.gg/9sudXdUdMx" style="width:min-content" target="_blank">
            <button class="download secondary">
              <i class="ti ti-brand-discord"></i>
              <span>Discord</span>
            </button>
          </a>
        </div>
      </div>
      <img class="demo" src="/assets/screenshot-light.png" id="screenshot" alt="A screenshot of Qration on desktop"/>
      <img class="demo-mobile" src="/assets/screenshot-light-mobile.png" id="screenshot-mobile" alt="A screenshot of Qration on mobile"/>
    </div>
  </div>
  <footer>
    Made with love by <a href="https://elektr1x.github.io">Aarnav</a> and <a href="https://github.com/tugrul-guran">Tugrul</a> under the GPL-3.0 license.
  </footer>
</body>
</html>
